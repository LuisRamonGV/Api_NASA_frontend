<div class="min-h-screen flex flex-col md:flex-row gap-4 p-4 bg-space-gradient">
  <app-loading-overlay *ngIf="isLoading"></app-loading-overlay>

  <div class="flex flex-col md:flex-row gap-4 w-full">
    <div class="w-full md:w-1/3 -mt-2">
      <app-left-column
        [apod]="apod"
        [error]="error"
        [isInfoBoxVisible]="isInfoBoxVisible"
        [(specificDate)]="specificDate"
        [(startDate)]="startDate"
        [(endDate)]="endDate"
        (getTodayApod)="getTodayApod()"
        (getApodByDate)="getApodByDate()"
        (getApodsByRange)="getApodsByRange()"
        (toggleInfoBox)="toggleInfoBox()">
      </app-left-column>
    </div>

    <div class="w-full md:w-2/3">
      <app-right-column
        [apod]="apod"
        [apodList]="apodList">
      </app-right-column>
    </div>
  </div>
</div>
