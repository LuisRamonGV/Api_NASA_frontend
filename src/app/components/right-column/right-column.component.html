<div class="right-column space-y-6 px-2 md:px-4">
  <ng-container *ngIf="apod && (!apodList || apodList.length === 0)">
    <div class="max-h-[90vh] overflow-hidden">
      <mat-card class="bg-gradient-to-br from-[#1b095a] via-[#2e003e] to-[#1b095a] text-textLight border border-accent shadow-space-card rounded-xl overflow-hidden">
        <mat-card-header class="pb-2">
          <mat-card-title class="text-accent text-xl md:text-2xl font-bold drop-shadow-sm">
            {{ apod.title || 'Astronomy Picture of the Day' }}
          </mat-card-title>
          <mat-card-subtitle class="text-secondary text-sm">
            {{ apod.date }}
          </mat-card-subtitle>
        </mat-card-header>

        <img *ngIf="apod.media_type === 'image'" 
             [src]="apod.url" 
             [alt]="apod.title" 
             class="w-full max-h-[500px] object-contain rounded-lg shadow-lg" />

        <iframe *ngIf="apod.media_type === 'video'" 
                [src]="getSafeUrl(apod.url)"
                frameborder="0" 
                allowfullscreen 
                class="w-full h-64 rounded-lg shadow-md">
        </iframe>

        <mat-card-content>
          <div class="block md:hidden mt-4 max-h-60 overflow-y-auto">
            <p class="text-textLight text-opacity-90 italic">
              {{ apod.explanation }}
            </p>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </ng-container>

  <ng-container *ngIf="apodList && apodList.length > 0">
    <div class="max-h-[95vh] overflow-y-auto pr-1">
      <div class="grid grid-cols-1 gap-6">
        <mat-card *ngFor="let item of apodList"
                  class="bg-card/10 text-textLight border border-secondary shadow-custom rounded-xl overflow-hidden">
          <mat-card-header class="pb-2">
            <mat-card-title class="text-accent text-lg font-semibold">
              {{ item.title }}
            </mat-card-title>
            <mat-card-subtitle class="text-secondary text-sm">
              {{ item.date }}
            </mat-card-subtitle>
          </mat-card-header>

          <img *ngIf="item.media_type === 'image'" 
               [src]="item.url" 
               [alt]="item.title" 
               class="w-full max-h-[400px] object-contain rounded-md shadow" />

          <iframe *ngIf="item.media_type === 'video'" 
                  [src]="getSafeUrl(item.url)" 
                  frameborder="0" 
                  allowfullscreen 
                  class="w-full h-60 rounded-lg shadow-md">
          </iframe>

          <mat-card-content class="pt-2">
            <p class="text-white/90 text-sm leading-relaxed italic">
              {{ item.explanation }}
            </p>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </ng-container>
</div>
