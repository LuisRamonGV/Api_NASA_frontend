<div class="right-column space-y-4">
  <ng-container *ngIf="apod && (!apodList || apodList.length === 0)">
    <div class="max-h-[90vh] overflow-hidden">
      <mat-card>
        <mat-card-header>
          <mat-card-title>{{ apod.title || 'Astronomy Picture of the Day' }}</mat-card-title>
          <mat-card-subtitle>{{ apod.date }}</mat-card-subtitle>
        </mat-card-header>
        <img *ngIf="apod.media_type === 'image'" 
             [src]="apod.url" 
             [alt]="apod.title" 
             class="w-full object-contain" />
             
        <iframe *ngIf="apod.media_type === 'video'" 
                [src]="getSafeUrl(apod.url)"
                frameborder="0" 
                allowfullscreen 
                class="w-full h-64">
        </iframe>
                
        <mat-card-content>
          <div class="block md:hidden mt-4 max-h-60 overflow-y-auto">
            <p>{{ apod.explanation }}</p>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </ng-container>
  
  <ng-container *ngIf="apodList && apodList.length > 0">
    <div class="max-h-[95vh] overflow-y-auto">
      <div class="grid grid-cols-1 gap-4">
        <mat-card *ngFor="let item of apodList">
          <mat-card-header>
            <mat-card-title>{{ item.title }}</mat-card-title>
            <mat-card-subtitle>{{ item.date }}</mat-card-subtitle>
          </mat-card-header>
          <img *ngIf="item.media_type === 'image'" 
               [src]="item.url" 
               [alt]="item.title" 
               class="w-full object-contain" />
               
          <iframe *ngIf="item.media_type === 'video'" 
                  [src]="getSafeUrl(item.url)" 
                  frameborder="0" 
                  allowfullscreen 
                  class="w-full h-64"></iframe>
                  
          <mat-card-content>
            <p>{{ item.explanation }}</p>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </ng-container>
</div>
